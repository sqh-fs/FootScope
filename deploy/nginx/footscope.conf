# Include from nginx's http context. Set the domain and certificate paths before enabling.
proxy_cache_path /var/cache/nginx/footscope levels=1:2 keys_zone=footscope:10m
                 max_size=64m inactive=10m use_temp_path=off;

log_format footscope escape=json
    '{"time":"$time_iso8601","id":"$request_id","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"upstream_seconds":"$upstream_response_time","cache":"$upstream_cache_status"}';

upstream footscope_api {
    least_conn;
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name footscope.example.com;
    ssl_certificate /etc/letsencrypt/live/footscope.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footscope.example.com/privkey.pem;

    root /opt/footscope/frontend/dist;
    access_log /var/log/nginx/footscope-access.log footscope;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 3s;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/v1/competitions/PL {
        proxy_cache footscope;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://footscope_api;
    }

    location /api/ {
        proxy_pass http://footscope_api;
    }

    location / {
        return 404;
    }
}
